name: release

# `v*` 태그를 푸시하면 Windows용 Tauri 앱을 빌드해 GitHub Release로 발행한다.
# 발행된 latest.json을 tauri.conf.json의 updater.endpoints가 폴링해
# 실행 중인 앱이 자동으로 새 버전을 감지·설치한다.
#
# 사용법:
#   1. src-tauri/tauri.conf.json 의 "version" 을 올린다 (package.json도 함께)
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# 사전 준비 (1회):
#   - `npm run tauri signer generate` 로 서명 키 생성
#   - 개인키를 저장소 Secret `TAURI_SIGNING_PRIVATE_KEY` 로 등록
#   - 키 암호를 설정했다면 `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` 도 등록
#   - tauri.conf.json 의 updater.pubkey 를 생성된 공개키로 교체
# 상세: knowledge/deployment.md, knowledge/decisions/ADR-004-github-releases-autoupdate.md

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AX 마케팅 자동화 ${{ github.ref_name }}"
          releaseBody: |
            자동 생성된 릴리즈입니다. 실행 중인 앱은 자동으로 이 버전을 감지합니다.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
